<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<meta name="description" content="Tracker — public page.">
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #666c78;
    --line: #e4e6ea;
    --accent: #2f6df6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --fg: #e9ebf0;
      --muted: #9aa1ae;
      --line: #23262d;
      --accent: #7aa2ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --fg: #e9ebf0;
    --muted: #9aa1ae;
    --line: #23262d;
    --accent: #7aa2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    min-height: 100vh;
  }
  main {
    margin: auto;
    padding: 64px 16px;
    width: 100%;
    max-width: 640px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
  }
  h1 {
    font-size: clamp(2.25rem, 8vw, 3.5rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 20px 0 12px;
  }
  p { color: var(--muted); margin: 0 0 14px; max-width: 46ch; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0 20px; }
  footer { font-size: 14px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <span class="badge">Work in progress</span>
    <h1>Tracker</h1>
    <p>This page is live and published with GitHub Pages. The real content lands here once the project's scope is settled.</p>
    <hr>
    <footer>Served from <code>main</code> &rarr; <code>/docs</code>.</footer>
  </main>
</body>
</html>
