<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The vendored Sakuga VFX core (public/sakuga-vfx/core.js). A CLASSIC script, not a
      module: the file is an IIFE that sets window.SakugaFX, and as a module it would be
      deferred past the point the app first wants it and its global would still be set
      late. %BASE_URL% is required rather than a bare "/": the app is served under
      /Tracker/ on GitHub Pages, where "/sakuga-vfx/core.js" is a 404 that only shows up
      in production. Verified in the built dist/index.html by a test.

      It loads here and nowhere else, so vitest — which never loads this file — leaves
      window.SakugaFX undefined and src/ui/sakuga/fx.ts no-ops throughout the suite.
    -->
    <script src="%BASE_URL%sakuga-vfx/core.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
